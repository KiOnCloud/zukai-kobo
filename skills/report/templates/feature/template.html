<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root { --accent: #2e7d5b; --ink: #1d1d1b; --muted: #5f5d58; --line: #dedbd3; --paper: #fffdf8; --panel: #f4f1ea; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Noto Sans", sans-serif; }
.cover { padding: 3.5rem 2rem 2.5rem; border-bottom: 6px solid var(--accent); background: linear-gradient(180deg, var(--panel), var(--paper)); }
.cover .eyebrow { margin: 0 0 .5rem; color: var(--accent); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.cover h1 { margin: 0 0 1.25rem; font-size: 2.2rem; line-height: 1.25; max-width: 46rem; }
.zukai-meta { display: grid; grid-template-columns: max-content 1fr; gap: .2rem 1.25rem; margin: 0; font-size: .9rem; color: var(--muted); max-width: 46rem; }
.zukai-meta dt { font-weight: 600; color: var(--ink); }
.zukai-meta dd { margin: 0; }
.page { display: grid; grid-template-columns: minmax(12rem, 16rem) minmax(0, 46rem); gap: 2.5rem; padding: 2rem; }
nav.toc { position: sticky; top: 1rem; align-self: start; font-size: .9rem; border-left: 3px solid var(--accent); padding-left: 1rem; }
nav.toc .zukai-toc-title { margin: 0 0 .5rem; font-weight: 700; }
nav.toc ol { margin: 0; padding-left: 1.1rem; }
nav.toc a { color: var(--ink); text-decoration: none; }
nav.toc a:hover { color: var(--accent); }
main h2 { margin: 2.25rem 0 .75rem; padding-bottom: .3rem; font-size: 1.45rem; border-bottom: 1px solid var(--line); }
main .zukai-section:first-child h2 { margin-top: 0; }
main h3 { margin: 1.5rem 0 .5rem; font-size: 1.1rem; }
main a { color: var(--accent); }
table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .93rem; }
th, td { border: 1px solid var(--line); padding: .4rem .65rem; text-align: left; vertical-align: top; }
th { background: var(--panel); }
pre { background: var(--panel); padding: .85rem 1rem; overflow-x: auto; border-radius: 4px; font-size: .88rem; }
code { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
blockquote { margin: 1rem 0; padding: .25rem 1rem; border-left: 4px solid var(--accent); background: var(--panel); }
img { max-width: 100%; }
figure.zukai-diagram { margin: 1rem 0; padding: 1rem; border: 1px solid var(--line); background: #fff; }
.zukai-embed-note, .zukai-missing-image { color: #8a5a00; font-size: .9rem; }
@media (max-width: 760px) { .page { grid-template-columns: 1fr; } nav.toc { position: static; } }
@media print {
  @page { margin: 18mm 16mm; }
  body { background: #fff; font-size: 11pt; }
  .cover { min-height: 60vh; background: none; break-after: page; }
  .page { display: block; padding: 0; }
  nav.toc { position: static; border: 0; padding: 0; break-after: page; }
  main .zukai-section { break-before: page; }
  main .zukai-section:first-child { break-before: auto; }
  h2, h3 { break-after: avoid; }
  table, figure, pre { break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>
<header class="cover">
<p class="eyebrow">Feature</p>
<h1>{{title}}</h1>
{{meta}}
</header>
<div class="page">
<nav class="toc">{{toc}}</nav>
<main>{{sections}}</main>
</div>
</body>
</html>
