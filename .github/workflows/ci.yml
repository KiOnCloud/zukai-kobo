name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifests parse and agree on the plugin name
        run: |
          node -e '
            const fs = require("fs");
            const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            if (!plugin.name || !plugin.version) throw new Error("plugin.json needs name and version");
            if (!market.name || !market.owner?.name || !Array.isArray(market.plugins)) throw new Error("marketplace.json needs name, owner.name, plugins[]");
            const entry = market.plugins.find((p) => p.name === plugin.name);
            if (!entry) throw new Error("marketplace.json has no entry named " + plugin.name);
            if (entry.source !== "./" && entry.source !== ".") throw new Error("entry source must be the marketplace root");
            if (!/^\d+\.\d+\.\d+$/.test(plugin.version)) throw new Error("plugin version must be MAJOR.MINOR.PATCH");
            console.log("manifests ok:", plugin.name, plugin.version);
          '

      - name: Check the skill frontmatter uses only portable fields and the plugin skill names
        run: |
          node -e '
            const fs = require("fs");
            const allowed = new Set(["name", "description", "license", "compatibility", "metadata", "allowed-tools"]);
            for (const name of ["draw", "revise", "recook", "sync"]) {
              const text = fs.readFileSync("skills/" + name + "/SKILL.md", "utf8");
              const m = text.match(/^---\n([\s\S]*?)\n---/);
              if (!m) throw new Error(name + "/SKILL.md has no frontmatter");
              const keys = m[1].split("\n").filter((l) => /^[a-zA-Z-]+:/.test(l)).map((l) => l.split(":")[0]);
              const bad = keys.filter((k) => !allowed.has(k));
              if (bad.length) throw new Error(name + ": non-portable frontmatter keys: " + bad.join(", "));
              if (!keys.includes("name") || !keys.includes("description")) throw new Error(name + ": name and description are required");
              if (!new RegExp("^name: " + name + "$", "m").test(m[1])) throw new Error("the skill in skills/" + name + " must be named " + name + "; the installers rename a folder copy from that exact line");
              const desc = m[1].split("\n").find((l) => l.startsWith("description: ")).slice(13);
              if (/: /.test(desc)) throw new Error(name + ": a colon followed by a space in the description breaks YAML plain scalars");
              console.log("frontmatter ok:", name, keys.join(", "));
            }
          '

      - name: Install dev dependencies
        if: ${{ hashFiles('skills/draw/scripts/package.json') != '' }}
        working-directory: skills/draw/scripts
        run: npm ci

      - name: Run tests
        if: ${{ hashFiles('skills/draw/scripts/package.json') != '' }}
        working-directory: skills/draw/scripts
        run: npm test

      - name: Assert the bundle is committed
        if: ${{ hashFiles('skills/draw/scripts/package.json') != '' }}
        run: git ls-files --error-unmatch skills/draw/scripts/bin/cli.mjs

      - name: Install the Claude Code CLI for strict validation
        id: claude_cli
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin strictly
        if: ${{ steps.claude_cli.outcome == 'success' }}
        run: claude plugin validate . --strict

      - name: Record that strict validation was skipped
        if: ${{ steps.claude_cli.outcome != 'success' }}
        run: echo "::warning::Claude Code CLI did not install; 'claude plugin validate . --strict' is a local pre-release step (see docs/install.md)."

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install both targets with install.ps1 and run the installed CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath .claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          $expected = 'zukai,zukai-recook,zukai-revise,zukai-sync'
          # Windows PowerShell 5.1 is what docs/install.md tells users to run; PowerShell 7 too.
          foreach ($shell in @('powershell', 'pwsh')) {
            foreach ($target in @('codex', 'claude-project')) {
              # Square brackets in the project path: PowerShell reads them as a wildcard
              # wherever a path is not taken literally.
              $dest = Join-Path $env:RUNNER_TEMP "$shell-$target [app]"
              [System.IO.Directory]::CreateDirectory($dest) | Out-Null
              & $shell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\install.ps1 -Target $target -Dest $dest
              if ($LASTEXITCODE -ne 0) { throw "$shell install.ps1 -Target $target exited $LASTEXITCODE" }

              $skills = Join-Path $dest $(if ($target -eq 'codex') { '.agents\skills' } else { '.claude\skills' })
              [string[]]$names = Get-ChildItem -LiteralPath $skills -Name
              [Array]::Sort($names, [StringComparer]::Ordinal)
              if (($names -join ',') -cne $expected) { throw "$shell/${target}: installed $($names -join ',')" }
              foreach ($name in $names) {
                $marker = [System.IO.File]::ReadAllText((Join-Path (Join-Path $skills $name) ".$name-version"))
                if ($marker -cne "$version`n") { throw "$shell/${target}: marker of $name is '$marker'" }
                # No byte-order mark and no CRLF in front of the frontmatter.
                $head = [System.IO.File]::ReadAllBytes((Join-Path (Join-Path $skills $name) 'SKILL.md'))[0..3]
                if (($head -join ',') -cne '45,45,45,10') { throw "$shell/${target}: SKILL.md of $name starts with bytes $($head -join ',')" }
              }

              $help = (& node (Join-Path $skills 'zukai\scripts\bin\cli.mjs') help) -join "`n"
              if ($LASTEXITCODE -ne 0 -or -not $help.Contains('cli.mjs stale <run-dir>...')) { throw "$shell/${target}: the installed CLI does not answer help" }

              $again = (& $shell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\install.ps1 -Target $target -Dest $dest) -join "`n"
              if ($LASTEXITCODE -ne 0 -or -not $again.Contains('already up to date')) { throw "$shell/${target}: a second run did not leave the install alone: $again" }
              Write-Output "ok: $shell $target"
            }
          }
